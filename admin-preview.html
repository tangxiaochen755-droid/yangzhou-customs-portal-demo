const renderers={spaces,space,section:sectionPage,documents,upload,handover,review,accounts};
let page=new URLSearchParams(location.search).get('page')||'space';if(!renderers[page])page='space';
const sectionName=new URLSearchParams(location.search).get('name');
document.querySelectorAll('.menu-item').forEach(a=>a.classList.toggle('active',a.dataset.page===page||(page==='spaces'&&a.dataset.page==='space')||(page==='upload'&&a.dataset.page==='documents')||(page==='review'&&a.dataset.page==='handover')));
document.querySelector('.space-menu-parent')?.classList.toggle('parent-active',page==='section');
document.querySelectorAll('.menu-subitem').forEach(a=>a.classList.toggle('active',page==='section'&&a.dataset.section===sectionName));
if(page==='spaces'){document.querySelector('.dept').innerHTML='<b>管理范围：扬州海关全部科室</b>平台管理员 · 陈管理员';document.querySelector('.role').textContent='陈管理员 ▾'}
document.getElementById('view-tag').textContent=titles[page];document.getElementById('main').innerHTML=renderers[page]();
const highfi=new URLSearchParams(location.search).get('highfi')==='1';
if(highfi){document.querySelector('.logo-mark').innerHTML='<img src="assets/images/customs-emblem-gold.png" alt="海关关徽">';document.querySelectorAll('a[href^="?"]').forEach(a=>{const url=new URL(a.href);url.searchParams.set('highfi','1');a.href=url.href});document.querySelectorAll('[onclick*="location.href"]').forEach(el=>el.setAttribute('onclick',el.getAttribute('onclick').replace('?page=','?highfi=1&page=')));document.title='扬州海关科室传承与交接工作平台 · 后台高保真原型'}
const mask=document.getElementById('modal-mask'),body=document.getElementById('modal-body');
function openModal(title,content,confirm='保存'){document.getElementById('modal-title').textContent=title;body.innerHTML=content;document.getElementById('modal-confirm').textContent=confirm;mask.classList.add('open');setTimeout(()=>body.querySelector('input,select')?.focus(),0)}
function closeModal(){mask.classList.remove('open')}
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
function addSection(){openModal('新增板块',`<div class="editor-note">所选模板同时决定后台配置字段和前台展示样式。新增板块固定追加在现有板块之后，不提供顺序调整。</div><div class="form-grid"><div class="form-row required"><label>板块名称</label><input class="input" id="section-name" placeholder="请输入板块名称"></div><div class="form-row required"><label>前台模板</label><select class="select" id="section-type"><option>图文模板</option><option>编号列表模板</option><option>组织人员模板</option><option>分工表格模板</option><option>时间轴模板</option><option>荣誉墙模板</option><option>文档列表模板</option></select></div><div class="form-row full"><label>板块说明</label><textarea placeholder="简要说明该板块展示什么内容"></textarea></div><div class="form-row"><label>创建状态</label><select class="select"><option>保存为草稿</option><option>创建后进入配置</option></select></div></div>`,'创建板块')}
function addPerson(){openModal('新增人员',`<div class="editor-note">新增后进入本科室组织架构，并可被人员分工和个人工作文档直接引用。</div><div class="form-grid"><div class="form-row required full"><label>人员照片</label><div class="upload">点击上传一寸照片<br><span class="muted">建议使用近期正面免冠照片</span></div></div><div class="form-row required"><label>姓名</label><input class="input" id="person-name" placeholder="请输入姓名"></div><div class="form-row required"><label>职位</label><input class="input" placeholder="如：一级主办"></div><div class="form-row required"><label>所属岗位</label><select class="select"><option>请选择岗位</option><option>科室负责人</option><option>综合业务审核岗</option><option>企业协调岗</option><option>综合内勤岗</option></select></div><div class="form-row"><label>关联账号</label><select class="select"><option>暂不关联</option><option>选择本科室已有账号</option><option>同步创建登录账号</option></select></div><div class="form-row"><label>展示状态</label><select class="select"><option>启用</option><option>暂不展示</option></select></div></div>`,'保存人员')}
function addPosition(){openModal('新增岗位',`<div class="editor-note">岗位用于组织架构归类，并可被人员分工直接引用。</div><div class="form-grid"><div class="form-row required"><label>岗位名称</label><input class="input" id="position-name" placeholder="请输入岗位名称"></div><div class="form-row"><label>展示状态</label><select class="select"><option>启用</option><option>暂不展示</option></select></div><div class="form-row full"><label>岗位说明</label><textarea placeholder="请输入岗位职责或设置说明"></textarea></div></div>`,'保存岗位')}
function selectDocuments(personal){openModal('选择已有文档',`<div class="filter" style="margin-bottom:12px"><div class="field"><label>文档名称</label><input class="input" placeholder="请输入文档名称"></div><div class="field"><label>查看权限</label><select class="select"><option>全部</option><option>本科室全员</option><option>指定人员</option></select></div></div><div class="table-wrap"><table class="table"><thead><tr><th>选择</th>${personal?'<th>归属人员</th>':''}<th>文档名称</th><th>查看权限</th><th>更新时间</th></tr></thead><tbody><tr><td><input type="checkbox" checked></td>${personal?'<td><select class="select"><option>王静</option><option>周明</option><option>林建国</option></select></td>':''}<td>业务一处2026年度工作总结</td><td>本科室全员</td><td>2026-08-29</td></tr><tr><td><input type="checkbox"></td>${personal?'<td><select class="select"><option>周明</option><option>王静</option></select></td>':''}<td>加工贸易监管专项工作情况</td><td>本科室全员</td><td>2026-08-27</td></tr><tr><td><input type="checkbox"></td>${personal?'<td><select class="select"><option>王静</option><option>周明</option></select></td>':''}<td>安全生产检查记录表</td><td>指定人员</td><td>2026-08-22</td></tr></tbody></table></div>`,'加入展示')}
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-add-section]');if(!t)return;const label=t.textContent.trim();if(t.matches('[data-add-section]'))addSection();else if(t.matches('[data-add-person]'))addPerson();else if(label==='新增岗位')addPosition();else if(t.matches('[data-select-docs]'))selectDocuments(t.dataset.personal==='true');else if(t.matches('[data-close]'))closeModal();else if(t.matches('[data-back]'))history.back();else if(t.matches('[data-search]'))toast('已按当前条件查询');else if(label==='重置'){t.closest('.filter')?.querySelectorAll('input,select').forEach(el=>el.tagName==='SELECT'?el.selectedIndex=0:el.value='');toast('筛选条件已重置')}else if(t.matches('[data-preview]'))toast('已打开当前草稿的前台预览');else if(t.matches('[data-save-draft]')||label==='保存草稿')toast('草稿已保存，前台线上内容未变化');else if(t.matches('[data-publish]'))toast('发布成功，前台已同步最新配置');else if(t.dataset.generic)toast(t.dataset.generic);else if(t.dataset.return){const note=document.getElementById('review-note');if(!note.value.trim()){note.focus();toast('请先填写退回原因');return}toast(`已退回到“${t.dataset.return}”节点`)}else if(t.matches('[data-toggle]')){t.textContent=t.textContent==='停用'?'启用':'停用';toast('板块状态已更新')}else if(t.matches('[data-sort]'))toast('拖动当前列表可调整前台展示顺序');else if(t.id!=='modal-confirm')toast(`${label}操作已打开`)});
document.getElementById('modal-confirm').addEventListener('click',()=>{const sectionName=document.getElementById('section-name');if(sectionName&&!sectionName.value.trim()){sectionName.focus();toast('请输入板块名称');return}const personName=document.getElementById('person-name');if(personName&&!personName.value.trim()){personName.focus();toast('请输入人员姓名');return}const positionName=document.getElementById('position-name');if(positionName&&!positionName.value.trim()){positionName.focus();toast('请输入岗位名称');return}const title=document.getElementById('modal-title').textContent;closeModal();toast(title==='选择已有文档'?'所选文档已加入展示，查看权限继承原文档':title==='新增人员'?'人员已加入业务一处组织架构':title==='新增岗位'?'岗位已加入业务一处组织架构':'板块已创建为草稿，发布后前台自动增加对应栏目')});
mask.addEventListener('click',e=>{if(e.target===mask)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.documentElement.dataset.prototypeReady='true';
if(highfi){const reveal=()=>requestAnimationFrame(()=>requestAnimationFrame(()=>{document.documentElement.classList.remove('highfi-boot');document.documentElement.dataset.highfiReady='true'}));const theme=document.getElementById('highfi-theme');if(theme.sheet)reveal();else{theme.addEventListener('load',reveal,{once:true});theme.addEventListener('error',reveal,{once:true})}}
</script>
</body>
</html>
